name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, such as v0.1.0
        required: true
        type: string

permissions: {}

env:
  UV_PYTHON_DOWNLOADS: never

# A pushed `v*` tag publishes that tag. A manual dispatch publishes an
# existing tag instead (for example one created while the repository was
# private): every job then tests and builds the tag's commit, not the branch
# the dispatch ran from. See RELEASING.md.
jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  build:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/uv-requirements.txt"
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: Tag matches project version and changelog
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python tools/release_policy.py verify-tag
      - name: Build distributions
        run: uv build --no-sources
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/semlog
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
