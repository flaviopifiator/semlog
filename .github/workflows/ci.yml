name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test; empty tests the commit that triggered the caller
        required: false
        type: string
        default: ""

permissions: {}

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/uv-requirements.txt"
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install uv (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/uv-requirements.txt"
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: Run test suite
        run: uv run python -m unittest discover

  build-wheel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/uv-requirements.txt"
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: Build wheel
        run: uv build
      - name: Locate built wheel
        id: wheel
        run: |
          wheel_path=$(ls dist/*.whl)
          echo "path=$wheel_path" >> "$GITHUB_OUTPUT"
      - name: Verify wheel contents (A7)
        env:
          SEMLOG_WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: uv run python -m unittest tests.test_wheel_contents -v

  fastapi-matrix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor row (STANDARDS.md CP-002): Python 3.10 only.
          - python: "3.10"
            fastapi: "0.71.0"
            starlette: "0.17.1"
          # Latest row: Python 3.10-3.14.
          - python: "3.10"
            fastapi: "0.141.1"
            starlette: "1.6.0"
          - python: "3.14"
            fastapi: "0.141.1"
            starlette: "1.6.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/uv-requirements.txt"
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: Run FastAPI matrix tests
        env:
          FASTAPI_VERSION: ${{ matrix.fastapi }}
          STARLETTE_VERSION: ${{ matrix.starlette }}
        run: uv run --with "fastapi==$FASTAPI_VERSION" --with "starlette==$STARLETTE_VERSION" python -m unittest tests.test_fastapi_matrix -v

  django-matrix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor row (STANDARDS.md CP-002): Python 3.10 only.
          - python: "3.10"
            django: "3.2.9"
          # Latest rows.
          - python: "3.10"
            django: "5.2"
          - python: "3.14"
            django: "5.2"
          - python: "3.12"
            django: "6.1"
          - python: "3.14"
            django: "6.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/uv-requirements.txt"
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: Run Django matrix tests
        env:
          DJANGO_VERSION: ${{ matrix.django }}
        run: uv run --with "django==$DJANGO_VERSION" python -m unittest tests.test_django_matrix -v

  aiohttp-matrix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor row: aiohttp 3.10.0 ships no wheel above CPython 3.12.
          - python: "3.10"
            aiohttp: "3.10.0"
          # Latest rows.
          - python: "3.10"
            aiohttp: "3.14.3"
          - python: "3.14"
            aiohttp: "3.14.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/uv-requirements.txt"
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: Run aiohttp matrix tests
        env:
          AIOHTTP_VERSION: ${{ matrix.aiohttp }}
        run: uv run --with "aiohttp==$AIOHTTP_VERSION" python -m unittest tests.test_aiohttp_middleware -v
