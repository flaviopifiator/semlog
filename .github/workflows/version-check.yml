name: version-check

on:
  pull_request:
    branches: [main]

permissions: {}

# Fails the pull request when pyproject.toml's version or CHANGELOG.md does
# not match what the Conventional Commits since the last release tag require.
# The full-history checkout (fetch-depth: 0) also fetches every tag.
# See RELEASING.md.
jobs:
  version-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check the version and changelog against the commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git tag --list 'v*' > "$RUNNER_TEMP/tags.txt"
          released="$(python tools/release_policy.py latest-tag --tags "$RUNNER_TEMP/tags.txt")"
          if [ -n "$released" ]; then
            range="refs/tags/$released..$HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          echo "Latest release tag: ${released:-none yet}. Checking the commits in $range."
          git log --format=%B%x00 "$range" > "$RUNNER_TEMP/commits.txt"
          git show "$BASE_SHA:pyproject.toml" > "$RUNNER_TEMP/base-pyproject.toml"
          git show "$HEAD_SHA:pyproject.toml" > "$RUNNER_TEMP/head-pyproject.toml"
          git show "$HEAD_SHA:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          python tools/release_policy.py check-pr \
            --tags "$RUNNER_TEMP/tags.txt" \
            --commits "$RUNNER_TEMP/commits.txt" \
            --base-pyproject "$RUNNER_TEMP/base-pyproject.toml" \
            --head-pyproject "$RUNNER_TEMP/head-pyproject.toml" \
            --changelog "$RUNNER_TEMP/CHANGELOG.md"
