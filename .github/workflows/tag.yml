name: tag

on:
  push:
    branches: [main]

permissions: {}

env:
  UV_PYTHON_DOWNLOADS: never

# Every merge to main tags the version declared in pyproject.toml, unless
# that tag already exists, and then publishes it after a maintainer approves
# the `pypi` environment. See RELEASING.md.
#
# A tag pushed with the default GITHUB_TOKEN does not start release.yml, and
# PyPI Trusted Publishing does not support publishing from a reusable
# workflow, so this workflow builds and publishes itself. Its build and
# publish steps must match release.yml (tests/test_repository_policy.py).
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      message: ${{ steps.info.outputs.message }}
      needed: ${{ steps.existing.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Read the version and its changelog section
        id: info
        run: python tools/release_policy.py tag-info >> "$GITHUB_OUTPUT"
      - name: Skip the release when its tag already exists
        id: existing
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist yet; releasing it."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: [plan, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/uv-requirements.txt"
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: Tag matches project version and changelog
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: python tools/release_policy.py verify-tag
      - name: Build distributions
        run: uv build --no-sources
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  tag:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    outputs:
      created: ${{ steps.push.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Create and push the annotated tag unless it already exists
        id: push
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TAG_MESSAGE: ${{ needs.plan.outputs.message }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists on origin; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::git ls-remote failed with exit code $status"
              exit "$status"
            fi
          fi
          printf '%s\n' "$TAG_MESSAGE" > "$RUNNER_TEMP/tag-message.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --cleanup=verbatim --file "$RUNNER_TEMP/tag-message.txt" "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Pushed annotated tag $TAG at $GITHUB_SHA."
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, tag]
    if: needs.tag.outputs.created == 'true' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/semlog
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
